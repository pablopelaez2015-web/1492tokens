# ============================================================
# Despliegue automático: cada push a main → build → rsync al VPS
# Secrets necesarios en GitHub → Settings → Secrets → Actions:
#   VPS_HOST      → IP o srv1094611.hstgr.cloud
#   VPS_USER      → deploy
#   VPS_SSH_KEY   → clave privada (ed25519) del usuario deploy
# ============================================================
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Preparar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Subir dist al VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/1492tokens/dist/"
